name: Sync Google Calendars

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Merge iCal Feeds
        run: |
          # Download First Calendar
          curl -L "https://calendar.google.com/calendar/ical/ru2o1vaod0uvmic25ohefrbkv4%40group.calendar.google.com/public/basic.ics" -o cal1.ics
          
          # Download Second Calendar (Family)
          curl -L "https://calendar.google.com/calendar/ical/family10979250294150398119%40group.calendar.google.com/public/basic.ics" -o cal2.ics
          
          # Combine both feeds into calendar.ics
          cat cal1.ics cal2.ics > calendar.ics

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add calendar.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update merged calendar feeds" && git push)
