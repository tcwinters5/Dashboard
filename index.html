<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ICAL.js parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b border-slate-800 pb-4 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white font-bold rounded-lg w-10 h-10 flex items-center justify-center text-lg shadow-md" id="header-day-num">--</div>
                <h1 id="month-year-title" class="text-2xl font-semibold tracking-tight text-slate-100">Loading Calendar...</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changeMonth(-1)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 text-sm transition">Prev</button>
                <button onclick="goToCurrentMonth()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 text-sm transition">Today</button>
                <button onclick="changeMonth(1)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 text-sm transition">Next</button>
            </div>
        </header>

        <!-- Calendar Grid Container -->
        <div class="bg-slate-800 rounded-xl shadow-xl border border-slate-700 overflow-hidden">
            <!-- Day of Week Headers -->
            <div class="grid grid-cols-7 bg-slate-800/80 border-b border-slate-700 text-center text-xs font-semibold text-slate-400 py-3 uppercase tracking-wider">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <!-- Days Grid -->
            <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr bg-slate-900/50 gap-px bg-slate-700">
                <!-- Dynamically injected days go here -->
            </div>
        </div>
    </div>

    <script>
        const ICAL_URL = 'https://calendar.google.com/calendar/ical/ru2o1vaod0uvmic25ohefrbkv4%40group.calendar.google.com/public/basic.ics';
        let allEvents = [];
        let currentDate = new Date();

        document.getElementById('header-day-num').innerText = new Date().getDate();

        async function initCalendar() {
            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ICAL_URL)}`;
                const response = await fetch(proxyUrl);
                const text = await response.text();

                const jcalData = ICAL.parse(text);
                const vcal = new ICAL.Component(jcalData);
                const vevents = vcal.getAllSubcomponents('vevent');

                allEvents = vevents.map(vevent => {
                    const event = new ICAL.Event(vevent);
                    return {
                        title: event.summary || 'Untitled Event',
                        start: event.startDate.toJSDate(),
                        end: event.endDate.toJSDate(),
                        allDay: event.startDate.isDate
                    };
                });

                renderMonthView();
            } catch (err) {
                document.getElementById('calendar-grid').innerHTML = `
                    <div class="col-span-7 p-6 text-center text-rose-400 text-sm bg-slate-800">
                        Failed to parse calendar feed. Please verify your public iCal link.
                    </div>`;
            }
        }

        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Set Title
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-year-title').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            let gridHtml = '';
            const today = new Date();

            // Previous month trailing days
            for (let i = firstDayIndex; i > 0; i--) {
                const dayNum = prevLastDay - i + 1;
                gridHtml += `<div class="bg-slate-800/40 min-h-[100px] p-2 text-slate-600 text-xs border border-slate-800">${dayNum}</div>`;
            }

            // Current month days
            for (let day = 1; day <= lastDay; day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                
                // Find events for this day
                const dayEvents = allEvents.filter(ev => {
                    const evDate = new Date(ev.start);
                    return evDate.getDate() === day && evDate.getMonth() === month && evDate.getFullYear() === year;
                });

                let eventsHtml = '';
                dayEvents.forEach(ev => {
                    const timeStr = ev.allDay ? '' : new Date(ev.start).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', '');
                    eventsHtml += `
                        <div class="bg-blue-600/30 border border-blue-500/40 text-blue-200 text-xs px-1.5 py-0.5 rounded truncate mb-1 shadow-sm font-medium" title="${ev.title}">
                            ${timeStr ? `<span class="opacity-75 mr-1">${timeStr}</span>` : ''}${ev.title}
                        </div>
                    `;
                });

                gridHtml = gridHtml + `
                    <div class="bg-slate-800 min-h-[100px] p-2 border border-slate-700/60 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-medium ${isToday ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold' : 'text-slate-300'}">${day}</span>
                        </div>
                        <div class="overflow-y-auto max-h-[70px] space-y-1">
                            ${eventsHtml}
                        </div>
                    </div>
                `;
            }

            // Next month leading days to fill 35 or 42 grid slots
            const totalCellsSoFar = firstDayIndex + lastDay;
            const remainingCells = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                gridHtml += `<div class="bg-slate-800/40 min-h-[100px] p-2 text-slate-600 text-xs border border-slate-800">${i}</div>`;
            }

            document.getElementById('calendar-grid').innerHTML = gridHtml;
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderMonthView();
        }

        function goToCurrentMonth() {
            currentDate = new Date();
            renderMonthView();
        }

        initCalendar();
    </script>
</body>
</html>
