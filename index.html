<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ICAL.js parser for reading public calendar feeds -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">📅 Calendar Dashboard</h1>
            <span id="current-date" class="text-sm text-slate-400"></span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
                <h2 class="text-xl font-semibold mb-4 text-sky-400">Upcoming Events</h2>
                <div id="event-list" class="space-y-4">
                    <p class="text-slate-400 animate-pulse">Loading events from calendar feed...</p>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-4 text-emerald-400">Dashboard Status</h2>
                    <p class="text-sm text-slate-300 mb-2">Hosted live via GitHub Pages.</p>
                    <p class="text-xs text-slate-500">Using public iCal feed (No API Key required).</p>
                </div>
                <div class="mt-6">
                    <button onclick="loadCalendar()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 px-4 rounded-lg transition">
                        Refresh Events
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        // Configured with your Calendar ID converted to a public iCal feed URL
        const ICAL_URL = 'https://calendar.google.com/calendar/ical/ru2o1vaod0uvmic25ohefrbkv4%40group.calendar.google.com/public/basic.ics';

        async function loadCalendar() {
            const container = document.getElementById('event-list');

            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ICAL_URL)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const text = await response.text();
                const jcalData = ICAL.parse(text);
                const vcal = new ICAL.Component(jcalData);
                const vevents = vcal.getAllSubcomponents('vevent');

                const now = new Date();
                let events = [];

                vevents.forEach(vevent => {
                    const event = new ICAL.Event(vevent);
                    if (event.endDate.toJSDate() >= now) {
                        events.push({
                            title: event.summary,
                            description: event.description || '',
                            start: event.startDate.toJSDate(),
                            allDay: event.startDate.isDate
                        });
                    }
                });

                events.sort((a, b) => a.start - b.start);
                events = events.slice(0, 10);

                if (events.length === 0) {
                    container.innerHTML = '<p class="text-slate-400">No upcoming events found.</p>';
                    return;
                }

                let html = '';
                events.forEach(ev => {
                    const formattedDate = ev.start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const formattedTime = ev.allDay ? 'All Day' : ev.start.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                    html += `
                        <div class="p-4 bg-slate-700/50 rounded-lg border border-slate-600 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="font-medium text-slate-100">${ev.title}</h3>
                                <p class="text-xs text-slate-400">${ev.description}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <span class="inline-block bg-sky-950 text-sky-300 text-xs px-2.5 py-1 rounded-full font-semibold border border-sky-800">
                                    ${formattedDate} &bull; ${formattedTime}
                                </span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `
                    <div class="p-4 bg-rose-950/50 border border-rose-600 rounded-lg text-rose-200 text-sm">
                        <strong>Could not load calendar feed:</strong> Make sure your calendar is set to <strong>Public</strong> in Google Calendar settings so the public link can read it.
                    </div>`;
            }
        }

        loadCalendar();
    </script>
</body>
</html>
