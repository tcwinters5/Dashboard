<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>.week-grid-cols { display: grid; grid-template-columns: repeat(7, minmax(140px, 1fr)); }</style>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="bg-white border p-4 shadow-sm flex justify-between items-center">
            <span id="date-range-label" class="font-bold">Loading Calendar...</span>
            <div class="flex gap-2">
                <button onclick="navigateTime(-1)" class="px-3 py-1 border rounded">‹</button>
                <button onclick="navigateTime(0)" class="px-3 py-1 border rounded">Today</button>
                <button onclick="navigateTime(1)" class="px-3 py-1 border rounded">›</button>
            </div>
        </div>

        <div id="view-week" class="bg-white border p-6 min-h-[500px]">
            <div id="week-headers" class="week-grid-cols bg-gray-50 border text-center font-bold text-xs p-2"></div>
            <div id="week-columns-grid" class="week-grid-cols bg-gray-100 border gap-px"></div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let viewDate = new Date();
        const CALENDAR_URL = "https://calendar.google.com/calendar/ical/ru2o1vaod0uvmic25ohefrbkv4%40group.calendar.google.com/private-be245e603d8a1264d587f7d67c6eb034/basic.ics";

        function getMonday(d) {
            let date = new Date(d);
            let day = date.getDay(), diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        async function initCalendar() {
            try {
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(CALENDAR_URL)}`);
                const text = await response.text();
                const jcalData = ICAL.parse(text);
                const vcal = new ICAL.Component(jcalData);
                const vevents = vcal.getAllSubcomponents('vevent');

                allEvents = [];
                const now = new Date();
                const limit = new Date();
                limit.setMonth(now.getMonth() + 2);

                vevents.forEach(vevent => {
                    const event = new ICAL.Event(vevent);
                    const expand = new ICAL.RecurExpansion({ component: vevent, dtstart: event.startDate });
                    
                    let next;
                    while ((next = expand.next())) {
                        let start = next.toJSDate();
                        if (start > limit) break;
                        allEvents.push({
                            title: event.summary,
                            start: start
                        });
                    }
                });
                renderWeekView();
            } catch (err) {
                document.getElementById('date-range-label').innerText = 'Error loading calendar.';
            }
        }

        function renderWeekView() {
            let monday = getMonday(viewDate);
            let weekDays = Array.from({length: 7}, (_, i) => new Date(monday.getTime() + i * 86400000));
            
            document.getElementById('week-headers').innerHTML = weekDays.map(d => `<div>${d.toLocaleDateString('en-US', {weekday:'short'})} ${d.getDate()}</div>`).join('');
            
            document.getElementById('week-columns-grid').innerHTML = weekDays.map(day => {
                const dayEvents = allEvents.filter(ev => ev.start.toDateString() === day.toDateString());
                return `<div class="bg-white p-2 min-h-[400px] border-r">${dayEvents.map(ev => `<div class="bg-blue-100 text-xs p-1 mb-1 rounded truncate">${ev.title}</div>`).join('')}</div>`;
            }).join('');
        }

        function navigateTime(dir) {
            if (dir === 0) viewDate = new Date();
            else viewDate.setDate(viewDate.getDate() + (dir * 7));
            renderWeekView();
        }

        initCalendar();
    </script>
</body>
</html>
