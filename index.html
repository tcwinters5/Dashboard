<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ICAL.js parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
        .week-grid-cols {
            display: grid;
            grid-template-columns: repeat(7, minmax(140px, 1fr));
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans p-4">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Top Control Bar with Explicit View Toggle -->
        <div class="bg-white border border-gray-300 rounded-t-lg p-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Left: Date Navigators & Label -->
            <div class="flex items-center space-x-2 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center space-x-1">
                    <button onclick="navigateTime(-1)" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold px-3 py-1.5 rounded text-sm shadow-sm transition">‹</button>
                    <button onclick="navigateTime(0)" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-3 py-1.5 rounded text-sm shadow-sm transition">Today</button>
                    <button onclick="navigateTime(1)" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold px-3 py-1.5 rounded text-sm shadow-sm transition">›</button>
                </div>
                <span id="date-range-label" class="text-base font-semibold text-gray-800 ml-3 truncate">Loading...</span>
            </div>
            
            <!-- Right: View Switcher Toggle Buttons -->
            <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 text-xs font-semibold text-gray-600 w-full md:w-auto justify-center">
                <button onclick="switchView('day')" id="btn-day" class="flex-1 md:flex-initial px-4 py-2 rounded-md transition text-center">Day</button>
                <button onclick="switchView('week')" id="btn-week" class="flex-1 md:flex-initial px-4 py-2 rounded-md transition text-center bg-white shadow-sm text-blue-600 font-bold">Week</button>
                <button onclick="switchView('month')" id="btn-month" class="flex-1 md:flex-initial px-4 py-2 rounded-md transition text-center">Month</button>
                <button onclick="switchView('tasks')" id="btn-tasks" class="flex-1 md:flex-initial px-4 py-2 rounded-md transition text-center">Task List</button>
            </div>
        </div>

        <!-- Main Dashboard Content Container -->
        <div class="bg-white border-x border-b border-gray-300 rounded-b-lg shadow-sm overflow-hidden min-h-[600px] p-6">
            
            <!-- VIEW 1: DAY VIEW (Chronological Blocks) -->
            <div id="view-day" class="hidden max-w-2xl mx-auto">
                <h2 id="day-header-title" class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200"></h2>
                <div id="day-blocks-container" class="space-y-3">
                    <p class="text-gray-500 text-sm">Loading day schedule...</p>
                </div>
            </div>

            <!-- VIEW 2: WEEK VIEW (Chronological Columns per Day) -->
            <div id="view-week" class="block overflow-x-auto">
                <div id="week-headers" class="week-grid-cols bg-gray-50 border border-gray-200 rounded-t-lg text-center text-xs font-semibold text-gray-600">
                    <!-- Injected Mon-Sun headers -->
                </div>
                <div id="week-columns-grid" class="week-grid-cols bg-gray-100 border-x border-b border-gray-200 rounded-b-lg gap-px bg-gray-200 min-h-[500px]">
                    <!-- Injected Mon-Sun columns -->
                </div>
            </div>

            <!-- VIEW 3: MONTH VIEW -->
            <div id="view-month" class="hidden">
                <div class="grid grid-cols-7 bg-gray-50 border-b border-gray-300 text-center text-xs font-semibold text-gray-600 py-2 uppercase tracking-wider">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="month-grid" class="grid grid-cols-7 auto-rows-fr bg-gray-200 gap-px"></div>
            </div>

            <!-- VIEW 4: TASK LIST VIEW -->
            <div id="view-tasks" class="hidden">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Upcoming Schedule (Task List Form)</h2>
                <div id="task-list-container" class="space-y-3">
                    <p class="text-gray-500 text-sm">Loading tasks...</p>
                </div>
            </div>

        </div>

        <!-- 7-Day Weather Outlook Panel -->
        <div class="bg-white border border-gray-300 rounded-lg p-5 shadow-sm">
            <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                <span>🌤️ 7-Day Weather Outlook — Loganville, Georgia</span>
            </h2>
            <div id="weather-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                <p class="text-gray-500 text-xs col-span-full">Loading weather forecast...</p>
            </div>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentView = 'week';
        let viewDate = new Date();

        const palettes = [
            { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-950', badgeBg: 'bg-emerald-100', badgeText: 'text-emerald-800' },
            { bg: 'bg-teal-50', border: 'border-teal-300', text: 'text-teal-950', badgeBg: 'bg-teal-100', badgeText: 'text-teal-800' },
            { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-950', badgeBg: 'bg-amber-100', badgeText: 'text-amber-800' },
            { bg: 'bg-rose-50', border: 'border-rose-300', text: 'text-rose-950', badgeBg: 'bg-rose-100', badgeText: 'text-rose-800' },
            { bg: 'bg-indigo-50', border: 'border-indigo-300', text: 'text-indigo-950', badgeBg: 'bg-indigo-100', badgeText: 'text-indigo-800' }
        ];

        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        async function initCalendar() {
            try {
                const response = await fetch('./calendar.ics');
                if (!response.ok) throw new Error('Could not find local calendar.ics file.');
                const text = await response.text();

                const jcalData = ICAL.parse(text);
                const vcal = new ICAL.Component(jcalData);
                const vevents = vcal.getAllSubcomponents('vevent');

                allEvents = vevents.map(vevent => {
                    const event = new ICAL.Event(vevent);
                    return {
                        title: event.summary || 'Untitled Event',
                        description: event.description || '',
                        start: event.startDate.toJSDate(),
                        end: event.endDate.toJSDate(),
                        allDay: event.startDate.isDate
                    };
                });

                allEvents.sort((a, b) => a.start - b.start);
                renderCurrentView();
            } catch (err) {
                document.getElementById('date-range-label').innerText = 'Failed to load calendar feed.';
            }
        }

        async function initWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.8423&longitude=-83.8993&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto');
                const data = await res.json();
                
                const days = data.daily.time;
                const maxs = data.daily.temperature_2m_max;
                const mins = data.daily.temperature_2m_min;
                const codes = data.daily.weathercode;

                let html = '';
                for (let i = 0; i < 7; i++) {
                    const dateObj = new Date(days[i] + 'T00:00:00');
                    const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    const condition = getWeatherCondition(codes[i]);

                    html += `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-center flex flex-col justify-between">
                            <div class="text-xs font-semibold text-gray-700">${dayName}</div>
                            <div class="text-2xl my-1">${condition.icon}</div>
                            <div class="text-xs text-gray-600 mb-2">${condition.text}</div>
                            <div class="text-xs font-bold text-gray-900">
                                <span class="text-rose-600">${Math.round(maxs[i])}°</span> / <span class="text-blue-600">${Math.round(mins[i])}°</span>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('weather-container').innerHTML = html;
            } catch (err) {
                document.getElementById('weather-container').innerHTML = '<p class="text-xs text-rose-500">Could not load weather forecast.</p>';
            }
        }

        function getWeatherCondition(code) {
            if (code === 0) return { icon: '☀️', text: 'Clear' };
            if (code >= 1 && code <= 3) return { icon: '⛅', text: 'Partly Cloudy' };
            if (code === 45 || code === 48) return { icon: '🌫️', text: 'Foggy' };
            if (code >= 51 && code <= 67) return { icon: '🌧️', text: 'Rain' };
            if (code >= 71 && code <= 77) return { icon: '❄️', text: 'Snow' };
            if (code >= 95) return { icon: '⛈️', text: 'Thunderstorm' };
            return { icon: '☁️', text: 'Cloudy' };
        }

        function switchView(view) {
            currentView = view;
            ['day', 'week', 'month', 'tasks'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`btn-${v}`).classList.remove('bg-white', 'shadow-sm', 'text-blue-600', 'font-bold');
            });
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(`btn-${view}`).classList.add('bg-white', 'shadow-sm', 'text-blue-600', 'font-bold');
            renderCurrentView();
        }

        function navigateTime(direction) {
            if (direction === 0) viewDate = new Date();
            else if (currentView === 'day') viewDate.setDate(viewDate.getDate() + direction);
            else if (currentView === 'week') viewDate.setDate(viewDate.getDate() + (direction * 7));
            else if (currentView === 'month') viewDate.setMonth(viewDate.getMonth() + direction);
            renderCurrentView();
        }

        function renderCurrentView() {
            if (currentView === 'day') renderDayView();
            else if (currentView === 'week') renderWeekView();
            else if (currentView === 'month') renderMonthView();
            else if (currentView === 'tasks') renderTaskListView();
        }

        function renderDayView() {
            document.getElementById('date-range-label').innerText = viewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('day-header-title').innerText = viewDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            const container = document.getElementById('day-blocks-container');
            const dayEvents = allEvents.filter(ev => isSameDay(new Date(ev.start), viewDate));

            if (dayEvents.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No scheduled events for this day.</p>';
                return;
            }

            let html = '';
            dayEvents.forEach((ev, idx) => {
                const palette = palettes[idx % palettes.length];
                const timeStr = ev.allDay ? 'All Day' : `${ev.start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} - ${ev.end.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;

                html += `
                    <div class="p-4 ${palette.bg} border ${palette.border} rounded-lg shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <h3 class="font-semibold ${palette.text}">${ev.title}</h3>
                            <p class="text-xs text-gray-600">${ev.description || 'No description provided.'}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="inline-block ${palette.badgeText} text-xs px-3 py-1 rounded-full font-semibold border ${palette.border} bg-white/70">
                                ${timeStr}
                            </span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderWeekView() {
            let monday = getMonday(viewDate);
            let weekDays = [];
            let curr = new Date(monday);
            for (let i = 0; i < 7; i++) { weekDays.push(new Date(curr)); curr.setDate(curr.getDate() + 1); }

            document.getElementById('date-range-label').innerText = `${weekDays[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${weekDays[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

            let headersHtml = '';
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekDays.forEach((dateObj, index) => {
                const isToday = isSameDay(dateObj, new Date());
                headersHtml += `
                    <div class="py-2.5 px-1 border-r border-gray-200 ${index === 6 ? 'border-r-0' : ''}">
                        <span class="text-gray-500 font-normal">${dayNames[index]}</span> 
                        <span class="${isToday ? 'bg-blue-600 text-white px-1.5 py-0.5 rounded-full font-bold ml-1' : 'text-gray-700 font-semibold'}">${dateObj.getMonth() + 1}/${dateObj.getDate()}</span>
                    </div>
                `;
            });
            document.getElementById('week-headers').innerHTML = headersHtml;

            let columnsHtml = '';
            weekDays.forEach((dateObj, index) => {
                const dayEvents = allEvents.filter(ev => isSameDay(new Date(ev.start), dateObj));
                
                let eventsHtml = '';
                if (dayEvents.length === 0) {
                    eventsHtml = '<p class="text-gray-400 text-xs italic text-center py-4">No events</p>';
                } else {
                    dayEvents.forEach((ev, evIdx) => {
                        const palette = palettes[evIdx % palettes.length];
                        const timeStr = ev.allDay ? 'All Day' : ev.start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', '');

                        eventsHtml += `
                            <div class="p-2.5 ${palette.bg} border ${palette.border} rounded-md shadow-sm mb-2 text-left">
                                <div class="font-bold ${palette.badgeText} text-[10px] mb-0.5">${timeStr}</div>
                                <div class="font-semibold ${palette.text} text-xs truncate">${ev.title}</div>
                            </div>
                        `;
                    });
                }

                columnsHtml += `
                    <div class="bg-white p-2.5 border-r border-gray-200 ${index === 6 ? 'border-r-0' : ''} flex flex-col min-h-[450px]">
                        <div class="space-y-2">${eventsHtml}</div>
                    </div>
                `;
            });
            document.getElementById('week-columns-grid').innerHTML = columnsHtml;
        }

        function renderMonthView() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('date-range-label').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            let gridHtml = '';
            const today = new Date();

            for (let i = firstDayIndex; i > 0; i--) {
                gridHtml += `<div class="bg-gray-50 min-h-[100px] p-2 text-gray-400 text-xs">${prevLastDay - i + 1}</div>`;
            }

            for (let day = 1; day <= lastDay; day++) {
                const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                const dayEvents = allEvents.filter(ev => {
                    const d = new Date(ev.start);
                    return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
                });

                let eventsHtml = '';
                dayEvents.forEach((ev, idx) => {
                    const palette = palettes[idx % palettes.length];
                    eventsHtml += `<div class="${palette.badgeBg} border ${palette.border} ${palette.text} text-xs px-1.5 py-0.5 rounded truncate mb-1 font-medium">${ev.title}</div>`;
                });

                gridHtml += `<div class="bg-white min-h-[100px] p-2 flex flex-col justify-between"><span class="text-xs font-medium ${isToday ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center font-bold' : 'text-gray-700'}">${day}</span><div class="overflow-y-auto max-h-[70px] space-y-1">${eventsHtml}</div></div>`;
            }

            const totalCellsSoFar = firstDayIndex + lastDay;
            const remainingCells = totalCellsSoFar <= 35 ? 35 - totalCellsSoFar : 42 - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                gridHtml += `<div class="bg-gray-50 min-h-[100px] p-2 text-gray-400 text-xs">${i}</div>`;
            }
            document.getElementById('month-grid').innerHTML = gridHtml;
        }

        function renderTaskListView() {
            document.getElementById('date-range-label').innerText = 'Upcoming Event Schedule';
            const container = document.getElementById('task-list-container');
            const now = new Date();
            const upcoming = allEvents.filter(ev => ev.end >= now).slice(0, 30);

            if (upcoming.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No upcoming events found.</p>';
                return;
            }

            let html = '';
            let lastDateStr = '';
            let colorIndex = 0;

            upcoming.forEach(ev => {
                const dateStr = ev.start.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                
                if (dateStr !== lastDateStr) {
                    if (lastDateStr !== '') {
                        colorIndex = (colorIndex + 1) % palettes.length;
                    }
                    lastDateStr = dateStr;
                }

                const palette = palettes[colorIndex];
                const timeStr = ev.allDay ? 'All Day' : `${ev.start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })} - ${ev.end.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
                
                html += `
                    <div class="p-4 ${palette.bg} border ${palette.border} rounded-lg shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 transition">
                        <div>
                            <h3 class="font-semibold ${palette.text}">${ev.title}</h3>
                            <p class="text-xs text-gray-600">${ev.description || 'No description provided.'}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="inline-block ${palette.badgeText} text-xs px-3 py-1 rounded-full font-semibold border ${palette.border} bg-white/60">
                                ${dateStr} &bull; ${timeStr}
                            </span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        }

        initCalendar();
        initWeather();
    </script>
</body>
</html>
