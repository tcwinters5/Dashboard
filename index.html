<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar - Weekly View</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ICAL.js parser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
        /* Custom scrollbar and grid tweaks for calendar precision */
        .cal-grid {
            display: grid;
            grid-template-columns: 60px repeat(7, minmax(120px, 1fr));
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto p-4">
        <!-- Top Navigation Bar -->
        <div class="bg-white border border-gray-300 rounded-t-lg px-4 py-3 flex flex-wrap justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3">
                <button onclick="changeWeek(-1)" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold px-3 py-1.5 rounded text-sm shadow-sm transition">‹</button>
                <button onclick="currentWeek()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-3 py-1.5 rounded text-sm shadow-sm transition">Today</button>
                <button onclick="changeWeek(1)" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold px-3 py-1.5 rounded text-sm shadow-sm transition">›</button>
                <span id="date-range-label" class="text-lg font-medium text-gray-700 ml-2">Loading week...</span>
            </div>
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider bg-gray-100 px-3 py-1.5 rounded border border-gray-200">
                Google Calendar &bull; Weekly View
            </div>
        </div>

        <!-- Main Calendar Container -->
        <div class="bg-white border-x border-b border-gray-300 rounded-b-lg shadow-sm overflow-hidden">
            <!-- Day Headers Row -->
            <div id="day-headers" class="cal-grid bg-gray-50 border-b border-gray-300 text-center text-xs font-semibold text-gray-600">
                <div class="py-2 border-r border-gray-200"></div>
                <!-- Injected Mon-Sun headers -->
            </div>

            <!-- Time Grid (Scrollable) -->
            <div class="overflow-y-auto max-h-[750px] relative bg-white">
                <div id="time-grid" class="cal-grid relative">
                    <!-- Time Column -->
                    <div class="border-r border-gray-200 bg-gray-50 text-right text-xs text-gray-500 select-none">
                        <!-- Hours 8am to 11pm -->
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">8am</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">9am</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">10am</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">11am</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">12pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">1pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">2pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">3pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">4pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">5pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">6pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">7pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">8pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">9pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">10pm</div>
                        <div class="h-14 pr-2 pt-1 border-b border-gray-100">11pm</div>
                    </div>

                    <!-- 7 Day Columns (Mon-Sun) -->
                    <div id="col-mon" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-tue" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-wed" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-thu" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-fri" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-sat" class="border-r border-gray-200 relative min-h-[896px]"></div>
                    <div id="col-sun" class="relative min-h-[896px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ICAL_URL = 'https://calendar.google.com/calendar/ical/ru2o1vaod0uvmic25ohefrbkv4%40group.calendar.google.com/public/basic.ics';
        let allEvents = [];
        let currentWeekStart = getMonday(new Date());

        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay(),
                diff = d.getDate() - day + (day === 0 ? -6 : 1); // adjust when day is sunday
            return new Date(d.setDate(diff));
        }

        async function initCalendar() {
            try {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ICAL_URL)}`;
                const response = await fetch(proxyUrl);
                const text = await response.text();

                const jcalData = ICAL.parse(text);
                const vcal = new ICAL.Component(jcalData);
                const vevents = vcal.getAllSubcomponents('vevent');

                allEvents = vevents.map(vevent => {
                    const event = new ICAL.Event(vevent);
                    return {
                        title: event.summary || 'Untitled Event',
                        start: event.startDate.toJSDate(),
                        end: event.endDate.toJSDate(),
                        allDay: event.startDate.isDate
                    };
                });

                renderWeekView();
            } catch (err) {
                document.getElementById('date-range-label').innerText = 'Failed to load calendar feed.';
            }
        }

        function renderWeekView() {
            // Calculate Mon-Sun dates
            let weekDays = [];
            let curr = new Date(currentWeekStart);
            for (let i = 0; i < 7; i++) {
                weekDays.push(new Date(curr));
                curr.setDate(curr.getDate() + 1);
            }

            // Set Header Date Range Label
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            const startStr = weekDays[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const endDate = weekDays[6];
            document.getElementById('date-range-label').innerText = `${startStr} – ${endDate.toLocaleDateString('en-US', options)}`;

            // Render Day Headers (Mon 9/19 format)
            let headersHtml = '<div class="py-2 border-r border-gray-200"></div>';
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            weekDays.forEach((dateObj, index) => {
                const isToday = isSameDay(dateObj, new Date());
                headersHtml += `
                    <div class="py-2 border-r border-gray-200 ${index === 6 ? 'border-r-0' : ''}">
                        <span class="text-gray-500 font-normal">${dayNames[index]}</span> 
                        <span class="${isToday ? 'bg-blue-600 text-white px-1.5 py-0.5 rounded-full font-bold ml-1' : 'text-gray-700 font-semibold'}">${dateObj.getMonth() + 1}/${dateObj.getDate()}</span>
                    </div>
                `;
            });
            document.getElementById('day-headers').innerHTML = headersHtml;

            // Clear previous day columns HTML and add hour background rows
            const colIds = ['col-mon', 'col-tue', 'col-wed', 'col-thu', 'col-fri', 'col-sat', 'col-sun'];
            colIds.forEach(id => {
                let bgRows = '';
                for(let h=0; h<16; h++) {
                    bgRows += `<div class="h-14 border-b border-gray-100 box-border"></div>`;
                }
                document.getElementById(id).innerHTML = bgRows;
            });

            // Map and position events onto the correct day columns
            weekDays.forEach((dateObj, index) => {
                const colId = colIds[index];
                const colContainer = document.getElementById(colId);

                const dayEvents = allEvents.filter(ev => isSameDay(new Date(ev.start), dateObj));

                // Soft pastel color palette matching classic GCal blocks
                const palettes = [
                    { bg: 'bg-emerald-100', border: 'border-emerald-300', text: 'text-emerald-900' },
                    { bg: 'bg-teal-100', border: 'border-teal-300', text: 'text-teal-900' },
                    { bg: 'bg-amber-100', border: 'border-amber-300', text: 'text-amber-900' },
                    { bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-900' },
                    { bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-900' }
                ];

                dayEvents.forEach((ev, evIdx) => {
                    const startDate = new Date(ev.start);
                    const endDate = new Date(ev.end);

                    // Calculate top offset and height based on 8 AM start baseline (56px per hour)
                    const startHour = startDate.getHours() + startDate.getMinutes() / 60;
                    const endHour = endDate.getHours() + endDate.getMinutes() / 60;
                    
                    const topPx = Math.max(0, (startHour - 8) * 56);
                    const durationHours = Math.max(0.5, endHour - startHour);
                    const heightPx = durationHours * 56;

                    const palette = palettes[evIdx % palettes.length];
                    const timeLabel = startDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', '');

                    const eventDiv = document.createElement('div');
                    eventDiv.className = `absolute left-1 right-1 rounded p-1.5 border shadow-sm overflow-hidden text-xs ${palette.bg} ${palette.border} ${palette.text}`;
                    eventDiv.style.top = `${topPx}px`;
                    eventDiv.style.height = `${heightPx}px`;
                    eventDiv.innerHTML = `
                        <div class="font-bold opacity-75 text-[10px]">${timeLabel}</div>
                        <div class="font-semibold truncate">${ev.title}</div>
                    `;
                    colContainer.appendChild(eventDiv);
                });
            });
        }

        function isSameDay(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function changeWeek(direction) {
            currentWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
            renderWeekView();
        }

        function currentWeek() {
            currentWeekStart = getMonday(new Date());
            renderWeekView();
        }

        initCalendar();
    </script>
</body>
</html>
